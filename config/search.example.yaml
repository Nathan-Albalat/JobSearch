# search.yaml — Le SUJET de recherche (par opposition à profile.yaml, qui est
# l'identité du candidat). Toutes les sections sont optionnelles : les clés
# absentes retombent sur les valeurs par défaut de jobsearch/config.py (DEFAULTS),
# calibrées sur le sujet de l'auteur d'origine — à ajuster ci-dessous pour le tien.
#
# Pour changer de sujet de recherche (ex: passer d'un stage à un CDI, ou
# changer de pays), voir la section « Changer de sujet de recherche » de
# CLAUDE.md — dans l'ordre : ce fichier, puis les 3 prompts (config/prompts/),
# puis profile.yaml, puis cv_data.yaml, puis repartir d'un data/ vierge.

sujet:
  label: "stage"                               # ex: "stage en droit", "CDI en marketing"
  type_contrat: "stage"                       # ex: "CDI", "alternance"
  type_contrat_negatif: "une offre d'emploi"   # ce que ce N'EST PAS
  # Dérivé automatiquement du secteur choisi à l'étape « pré-filtre » de
  # `jobsearch --setup` (voir jobsearch/resources/prefilter_presets.yaml).
  # Exemple si renseigné à la main : "spécialisé dans les stages en informatique et ingénierie logicielle"
  expertise_recruteur: ""

duree:
  min_semaines: 12
  texte: "12 semaines minimum"
  applicable: true   # false pour un CDI : neutralise les règles de durée

# Renseignés automatiquement par `jobsearch --setup` (question « date de disponibilité »).
# Laissés vides ici : ce fichier est un modèle, pas la config d'un candidat en particulier.
disponibilite:
  debut_iso: ""
  texte_fr: ""
  texte_en: ""

geo:
  priorite:
    - "Belgique"
    - "Suisse"
    - "Allemagne"
    - "Italie"
  secondaire:
    - "Europe (hors pays frontaliers)"
  dernier_recours:
    - "Hors Europe"
  notes: "Préciser ici les contraintes de mobilité (ex: télétravail accepté, présentiel obligatoire dans une zone donnée)."
  # ⚠️ `details` doit rester cohérent avec `priorite`/`secondaire` ci-dessus : c'est ce bloc
  # qui est réellement injecté dans le barème du prompt ({geo_details}). Changer `priorite`
  # sans réécrire `details` laisse l'ancienne géographie piloter le scoring — c'était
  # précisément l'incohérence de l'ancienne version (l'Italie était absente du prompt).
  details:
    - "**Italie** : Milan, Turin, Bologne — marché tech en croissance"
    - "**Belgique** : Bruxelles, Gand, Louvain — bonne densité tech, proche géographiquement, stage facilité par la francophonie partielle"
    - "**Suisse** : Zurich, Lausanne, Bâle — excellent niveau technique, salaires de stage élevés, mais coût de la vie important"
    - "**Allemagne** : Berlin, Munich, Hambourg, Francfort — vaste marché, nombreuses offres tech, langue souvent pas requise pour les postes internationaux"
    - "**Remote Europe** : acceptable, mais préférer les offres avec un ancrage géographique européen (pas uniquement \"global remote\" sans fuseau horaire spécifié)"
    - "**France** : acceptable mais pas prioritaire — à scorer normalement sur le contenu technique sans bonus géographique"
    - "**Hors Europe** : pénaliser légèrement, sauf si le contenu technique est exceptionnel"

# Domaines visés — dérivés automatiquement du secteur choisi à l'étape
# « pré-filtre » de `jobsearch --setup` (voir jobsearch/resources/prefilter_presets.yaml,
# ou une saisie libre). Exemple ci-dessous à titre d'illustration uniquement.
domaines:
  liste: []   # ex: "Développement logiciel", "Droit des affaires", "Marketing digital"…
  ouverture: "Ouvert à d'autres domaines proches si le projet est intéressant"

scoring:
  seuil: 6
  bonus:
    - "Compétences attendues largement maîtrisées par le candidat"
    - "Domaine directement aligné avec les domaines visés"
    - "Localisation prioritaire"
    - "Entreprise internationale"
  malus:
    - "Exige expérience professionnelle > 1 an"
    - "Uniquement présentiel hors Europe"
    - "Durée inférieure au minimum souhaité"
  titre_bonus:
    - "Junior"
    - "Intern"
  penalite_diplome: true   # false en recherche d'emploi : inverse le sens de la règle diplôme

# Pré-filtre mots-clés — le filtre GRATUIT appliqué avant l'appel payant à
# Haiku. `jobsearch --setup` le pré-remplit depuis un preset sectoriel (ou une
# saisie libre) choisi à l'étape « pré-filtre » — voir
# jobsearch/resources/prefilter_presets.yaml pour la liste des secteurs
# disponibles (informatique, santé, droit, commerce/vente,
# communication/marketing, ingénierie, enseignement…) et pour dupliquer un
# preset vers un nouveau secteur sans toucher au code Python. Les noms de
# groupes ci-dessous (ex: `roles`, `termes_fr_nl_de`) n'ont pas de sens
# fonctionnel : tous les mots-clés sont aplatis avant utilisation
# (`Search.prefilter_keywords`). Le groupe `contrat` est un cas particulier :
# il est dérivé automatiquement du type de contrat choisi (`sujet.type_contrat`)
# — c'est le levier n°1 du pivot vers un autre type de contrat.
prefilter:
  enabled: true
  desc_chars: 400
  keywords: {}   # rempli par `jobsearch --setup` — vide ici, ce fichier est un modèle générique
  exclude_keywords: []

dedup:
  title_noise:
    - stage
    - internship
    - intern
    - "h/f"
    - "f/h"
    - "m/f"
    - "f/m"
    - "m/w/d"
    - "w/m/d"
    - cdi
    - cdd
  title_noise_extra_regex: '20\d\d'
  similarity: 0.9

models:
  filter:
    model: "claude-haiku-4-5-20251001"
    max_tokens: 512
    batch_min_offers: 6
    batch_poll_seconds: 30
  generate:
    model: "claude-sonnet-4-6"
    max_tokens: 2048

source_defaults:
  jobspy:
    sites: [linkedin, indeed]
    search_term: "software intern"
    results_wanted: 30
    hours_old: 72
    country_indeed: "netherlands"
    fetch_description: true
  adzuna:
    country: "nl"
    what: "internship software"
    results_per_page: 50
    pages: 1
