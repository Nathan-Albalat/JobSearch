# source_presets.yaml — catalogue par secteur utilisé par `jobsearch --setup`
# (étape « pré-filtre ») pour générer `sources.yaml` sans que l'utilisateur ait
# à toucher au code Python ni à connaître le format des sources. Calqué sur
# `prefilter_presets.yaml` (mêmes 7 secteurs) — voir `jobsearch/wizard.py`,
# fonction `render_sources_yaml`.
#
# Chaque secteur porte :
#   `queries_en` : 2-4 termes de recherche métier en anglais (utilisés pour
#                  LinkedIn/Indeed via jobspy, et Adzuna). Combinés à l'écriture
#                  avec un terme dérivé du type de contrat (voir
#                  `derive_contrat_en` dans wizard.py) — ex: "software
#                  engineer" + "internship".
#   `queries_fr` : 2-4 termes de recherche métier en français (utilisés pour
#                  WTTJ `job_title` et HelloWork `k`, deux sites francophones).
#   `feeds`      : sources à URL figée (type `rss`/`api_json`) pertinentes pour
#                  ce secteur, au format exact des entrées de `sources.yaml`.
#                  NE JAMAIS inventer d'URL ici : une URL fausse produit une
#                  source en erreur à chaque scrape. Le secteur `informatique`
#                  conserve les 8 flux tech/remote historiques (RemoteOK,
#                  Himalayas, Jobicy) + Arbeitnow. Les autres secteurs n'ont,
#                  à la connaissance de l'auteur, aucun flux RSS de qualité
#                  équivalent (pas de "RemoteOK du droit") : ils ne reçoivent
#                  qu'Arbeitnow (généraliste, toutes professions). L'essentiel
#                  du volume pour ces secteurs vient donc des sources
#                  paramétrables (LinkedIn/Indeed/Adzuna/WTTJ/HelloWork,
#                  générées dynamiquement depuis `queries_en`/`queries_fr` et
#                  la géographie choisie) — libre à l'utilisateur d'ajouter ses
#                  propres flux RSS sectoriels dans `sources.yaml` ensuite
#                  (onglet Réglages, touche 6), rien n'empêche de dupliquer une
#                  entrée `rss` existante.
#
# Ajouter un secteur : dupliquer une entrée (queries_en/queries_fr/feeds),
# changer la clé (utilisée comme identifiant interne, doit correspondre à une
# clé de `prefilter_presets.yaml` pour que le secteur choisi à l'étape
# pré-filtre pilote aussi `sources.yaml`). Aucune modification de code requise.

informatique:
  queries_en:
    - "software engineer"
    - "software developer"
  queries_fr:
    - "développeur informatique"
    - "ingénieur logiciel"
  feeds:
    - name: "RemoteOK - Internships"
      url: "https://remoteok.com/remote-intern-jobs.rss"
      type: rss
      country: "INTL"
    - name: "RemoteOK - Python Jobs"
      url: "https://remoteok.com/remote-python-jobs.rss"
      type: rss
      country: "INTL"
    - name: "RemoteOK - Backend Jobs"
      url: "https://remoteok.com/remote-backend-jobs.rss"
      type: rss
      country: "INTL"
    - name: "RemoteOK - JavaScript Jobs"
      url: "https://remoteok.com/remote-javascript-jobs.rss"
      type: rss
      country: "INTL"
    - name: "RemoteOK - Java Jobs"
      url: "https://remoteok.com/remote-java-jobs.rss"
      type: rss
      country: "INTL"
    - name: "Himalayas - Remote Jobs"
      url: "https://himalayas.app/jobs/rss"
      type: rss
      country: "INTL"
    - name: "Jobicy - Internships"
      url: "https://jobicy.com/?feed=job_feed&job_types=internship"
      type: rss
      country: "INTL"
    - name: "Arbeitnow - Jobs EU"
      url: "https://www.arbeitnow.com/api/job-board-api"
      type: api_json
      country: "EU"
      params:
        pages: 2
        # `job_types` est régénéré à l'écriture depuis le type de contrat
        # choisi (voir `derive_arbeitnow_job_types` dans wizard.py) — la
        # valeur ici n'est qu'un repli si jamais le type de contrat n'est pas
        # reconnu.
        job_types:
          - internship

sante:
  queries_en:
    - "nurse"
    - "healthcare"
  queries_fr:
    - "infirmier"
    - "soignant"
  # Aucun flux RSS santé connu de qualité (voir note en tête de fichier) —
  # seul Arbeitnow (généraliste) est inclus, le reste du volume vient des
  # sources paramétrables (LinkedIn/Indeed/Adzuna/WTTJ/HelloWork).
  feeds:
    - name: "Arbeitnow - Jobs EU"
      url: "https://www.arbeitnow.com/api/job-board-api"
      type: api_json
      country: "EU"
      params:
        pages: 2
        job_types: []

