[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch"
version = "1.2.0"
description = "Pipeline automatisé de recherche de stage/emploi : collecte d'offres, filtrage par scoring Claude, rapport, lettre de motivation et CV adaptés."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nathan Albalat" }]
keywords = ["job-search", "scraping", "claude", "anthropic", "cv", "cover-letter", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "anthropic",
    "feedparser",
    "requests",
    "beautifulsoup4",
    "pyyaml",
    "python-dotenv",
    "jinja2",
    "weasyprint",
    "textual",
]

[project.optional-dependencies]
jobspy = ["python-jobspy"]
# API HTTP + vue web (jobsearch --serve) : même motif que [jobspy], extra
# optionnel pour garder l'installation de base légère.
server = ["fastapi", "uvicorn[standard]", "python-multipart"]

[project.urls]
Homepage = "https://github.com/Nathan-Albalat/JobSearch"
Repository = "https://github.com/Nathan-Albalat/JobSearch"
Issues = "https://github.com/Nathan-Albalat/JobSearch/issues"

[project.scripts]
jobsearch = "jobsearch.cli:main"

[tool.setuptools.packages.find]
include = ["jobsearch*"]

[tool.setuptools.package-data]
jobsearch = [
    "resources/prompts/*.txt",
    "resources/templates/*.html",
    "resources/templates/fonts/*.ttf",
    "resources/prefilter_presets.yaml",
    "resources/source_presets.yaml",
    "resources/examples/*",
    "resources/examples/.env.example",
    "resources/web/*.html",
]
