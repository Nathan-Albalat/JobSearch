sources:
  # --- Stages / Internships (international & remote) ---
  - name: "RemoteOK - Internships"
    url: "https://remoteok.com/remote-intern-jobs.rss"
    type: rss
    country: "INTL"

  - name: "RemoteOK - Python Jobs"
    url: "https://remoteok.com/remote-python-jobs.rss"
    type: rss
    country: "INTL"

  - name: "RemoteOK - Backend Jobs"
    url: "https://remoteok.com/remote-backend-jobs.rss"
    type: rss
    country: "INTL"

  - name: "RemoteOK - JavaScript Jobs"
    url: "https://remoteok.com/remote-javascript-jobs.rss"
    type: rss
    country: "INTL"

  - name: "RemoteOK - Java Jobs"
    url: "https://remoteok.com/remote-java-jobs.rss"
    type: rss
    country: "INTL"

  - name: "Himalayas - Remote Jobs"
    url: "https://himalayas.app/jobs/rss"
    type: rss
    country: "INTL"

  - name: "Jobicy - Internships"
    url: "https://jobicy.com/?feed=job_feed&job_types=internship"
    type: rss
    country: "INTL"

  # --- JSON APIs ---
  - name: "Arbeitnow - Internships EU"
    url: "https://www.arbeitnow.com/api/job-board-api"
    type: api_json
    country: "EU"
    params:
      job_types:
        - internship
      pages: 2

  # --- JobSpy (LinkedIn + Indeed via python-jobspy) ---
  - name: "JobSpy - Software intern NL"
    type: jobspy
    country: "NL"
    params:
      sites: [linkedin, indeed]
      search_term: "software intern"
      location: "Netherlands"
      country_indeed: "netherlands"
      hours_old: 72
      results_wanted: 50

  - name: "JobSpy - Software intern Europe"
    type: jobspy
    country: "EU"
    params:
      sites: [linkedin]
      search_term: "software engineering internship"
      location: "European Union"
      hours_old: 72
      results_wanted: 40

  # --- Adzuna (requiert ADZUNA_APP_ID / ADZUNA_APP_KEY dans .env) ---
  - name: "Adzuna NL - Software internships"
    type: adzuna
    country: "NL"
    params:
      country: nl
      what: "software intern"
      pages: 2

  # --- Welcome to the Jungle (API publique v3, sans auth) ---
  # Pièges vérifiés (voir CLAUDE.md) : chaque offre est répétée une fois par bureau
  # de l'entreprise → dédup sur (organization.slug, name), jamais reference/slug.
  # `per_page` est verrouillé à 10 côté serveur ; `contract_type` est refusé en query
  # (422) → filtré côté client via `contract_types`. `locations` est un mapping
  # YAML natif (sérialisé en JSON par le fetch), pas une chaîne.
  - name: "WTTJ - Intern NL"
    type: wttj
    country: "NL"
    params:
      job_title: "intern"
      locations:
        country: "Netherlands"
        country_code: "NL"
        label: "Pays-Bas"
        latitude: 52.25
        longitude: 5.75
      contract_types: [internship, apprenticeship]
      pages: 3

  - name: "WTTJ - Developer NL"
    type: wttj
    country: "NL"
    params:
      job_title: "developer"
      locations:
        country: "Netherlands"
        country_code: "NL"
        label: "Pays-Bas"
        latitude: 52.25
        longitude: 5.75
      contract_types: [internship, apprenticeship]
      pages: 2

  - name: "WTTJ - Software engineering internship NL"
    type: wttj
    country: "NL"
    params:
      job_title: "software engineering internship"
      locations:
        country: "Netherlands"
        country_code: "NL"
        label: "Pays-Bas"
        latitude: 52.25
        longitude: 5.75
      contract_types: [internship, apprenticeship]
      pages: 2

  # --- WTTJ FR (désactivée par défaut, activer avec --with fr) ---
  - name: "WTTJ - Stage développeur FR"
    type: wttj
    group: fr
    optional: true
    country: "FR"
    params:
      job_title: "stage développeur"
      locations:
        country: "France"
        country_code: "FR"
        label: "France"
        latitude: 46.6
        longitude: 2.3
      pages: 3

  - name: "WTTJ - Stage data FR"
    type: wttj
    group: fr
    optional: true
    country: "FR"
    params:
      job_title: "stage data"
      locations:
        country: "France"
        country_code: "FR"
        label: "France"
        latitude: 46.6
        longitude: 2.3
      pages: 2

  # --- HelloWork (FR uniquement — désactivée par défaut, activer avec --with fr) ---
  - name: "HelloWork - Développeur informatique (Stage)"
    type: hellowork
    group: fr
    optional: true
    country: "FR"
    params:
      k: "développeur informatique"
      c: "Stage"
      pages: 2

  - name: "HelloWork - Data (Stage)"
    type: hellowork
    group: fr
    optional: true
    country: "FR"
    params:
      k: "data"
      c: "Stage"
      pages: 2

# --- Sources à ajouter manuellement quand disponibles ---
# APEC (404), Nationale-vacaturebank.nl (403), monsterboard.nl (pas de RSS public)
