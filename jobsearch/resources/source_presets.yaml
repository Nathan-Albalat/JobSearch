# ---------------------------------------------------------------------------
# Table géographique — placée ici plutôt que dans un module Python : elle est
# du même ordre de nature que le reste de ce fichier (données déclaratives
# consultées uniquement par `jobsearch --setup`, jamais par le pipeline de
# scrape lui-même), et vivre à côté des presets évite un module dédié pour une
# poignée de constantes. Sert à générer les paramètres géographiques des
# sources WTTJ (`locations`), Adzuna (`country`) et jobspy (`country_indeed`)
# à partir du/des pays prioritaires choisis à l'étape « sujet » de l'assistant
# (`jobsearch/wizard.py`, fonction `resolve_country_code` fait le lien entre
# le texte libre saisi par l'utilisateur, ex. "Pays-Bas", et une clé ci-dessous
# en réutilisant les tables de `jobsearch/tracker.py`, `_COUNTRY_NAMES`/
# `_COUNTRY_ALIASES` — pas de troisième table de noms de pays à maintenir).
#
# `adzuna_supported` : Adzuna ne couvre pas tous les pays européens. Liste
# retenue ici (NL, FR, DE, GB, IT, AT, PL) d'après la documentation publique
# de l'API Adzuna (developer.adzuna.com) au moment de l'écriture — à vérifier
# soi-même si un pays de cette liste ne fonctionne plus, ou si un pays absent
# de la liste est en fait couvert : mieux vaut ne pas générer une source
# Adzuna cassée que d'en générer une hasardeuse.
# `country_indeed` : valeur attendue par `python-jobspy` pour le paramètre
# `country_indeed` — seule la valeur "netherlands" a été vérifiée en usage
# réel (config d'origine de ce dépôt) ; les autres sont les noms de pays en
# anglais/minuscules attendus par la documentation de jobspy, à ajuster si
# une source jobspy échoue pour un pays donné.
geo:
  NL:
    label: "Pays-Bas"
    country_indeed: "netherlands"
    latitude: 52.25
    longitude: 5.75
    adzuna_supported: true
