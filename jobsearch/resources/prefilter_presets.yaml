# prefilter_presets.yaml — jeux de mots-clés pré-remplis par secteur, proposés
# à l'étape « pré-filtre » de `jobsearch --setup`. Chaque entrée alimente
# `prefilter.keywords` de search.yaml (le groupe `contrat` est, lui, dérivé du
# type de contrat choisi, jamais de ce fichier — voir `derive_contrat_keywords`
# dans jobsearch/wizard.py).
#
# `label` : affiché dans l'assistant. `expertise_recruteur` : gabarit avec
# `{type_contrat}`, substitué à l'écriture. `domaines` : suggestion de
# `domaines.liste`, modifiable dans l'assistant avant écriture. `keywords` :
# groupes de mots-clés (les noms de groupes n'ont pas de sens fonctionnel,
# ils sont aplatis avant utilisation — is_tech_offer/prefilter_keywords).
#
# Ajouter un secteur : dupliquer une entrée, changer la clé (utilisée comme
# identifiant interne) et son contenu. Aucune modification de code requise.

informatique:
  label: "Informatique / Ingénierie logicielle"
  expertise_recruteur: "spécialisé dans les {type_contrat} en informatique et ingénierie logicielle"
  domaines:
    - "Développement logiciel (backend, fullstack)"
    - "Data Engineering"
    - "Intelligence Artificielle / Machine Learning"
    - "Informatique générale"
